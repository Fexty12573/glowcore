name: Unity Multi-Branch Workflow

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - 'doc/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'doc/**'

permissions:
  contents: write

env:
  UNITY_EDITOR_PATH: /home/yoris/Unity/Hub/Editor/6000.3.9f1/Editor/Unity

jobs:
  buildWebGL:
    name: Build WebGL
    # if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Activate Unity License
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build WebGL
        run: |
          "${{ env.UNITY_EDITOR_PATH }}" -batchmode -nographics -quit \
            -projectPath "${{ github.workspace }}" \
            -buildTarget WebGL \
            -executeMethod BuildScript.BuildWebGL \
            -logFile -

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

  deployPage:
    name: Deploy to Pages
    needs: buildWebGL
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: build-temp

      - name: Set Target Folder
        id: folder_logic
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "dest=prod/webgl" >> $GITHUB_OUTPUT
          else
            echo "dest=dev/webgl" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build-temp/WebGL
          target-folder: ${{ steps.folder_logic.outputs.dest }}
          branch: pages
          clean: false

  buildWindows:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Activate Unity License
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Windows
        run: |
          "${{ env.UNITY_EDITOR_PATH }}" -batchmode -nographics -quit \
            -projectPath "${{ github.workspace }}" \
            -buildTarget StandaloneWindows64 \
            -executeMethod BuildScript.BuildWindows \
            -logFile -

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Exe
          path: build/StandaloneWindows64

  buildLinux:
    name: Build Linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Activate Unity License
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Linux
        run: |
          "${{ env.UNITY_EDITOR_PATH }}" -batchmode -nographics -quit \
            -projectPath "${{ github.workspace }}" \
            -buildTarget StandaloneLinux64 \
            -executeMethod BuildScript.BuildLinux \
            -logFile -

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Build-Binary
          path: build/StandaloneLinux64

  release:
    name: Create GitHub Release
    needs: [buildWindows, buildLinux]
    runs-on: [self-hosted, Linux, X64]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build-Exe
          path: Windows-Build
      - name: Zip Windows
        run: zip -r GlowCore-Windows-${{ github.ref_name }}.zip Windows-Build/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-Build-Binary
          path: Linux-Build
      - name: Zip Linux
        run: zip -r GlowCore-Linux-${{ github.ref_name }}.zip Linux-Build/

      - name: Release Content
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Automatic release from tag ${{ github.ref_name }}

            ---
          files: |
            GlowCore-Windows-${{ github.ref_name }}.zip
            GlowCore-Linux-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
