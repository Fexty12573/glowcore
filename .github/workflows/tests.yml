name: Tests

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
    paths-ignore:
      - 'doc/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'doc/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  UNITY_EDITOR_PATH: /home/yoris/Unity/Hub/Editor/6000.3.9f1/Editor/Unity

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Activate Unity License
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode Tests
        run: |
          "${{ env.UNITY_EDITOR_PATH }}" -batchmode -nographics \
            -runTests -testPlatform EditMode \
            -projectPath "${{ github.workspace }}" \
            -testResults "${{ github.workspace }}/test-results/editmode-results.xml" \
            -enableCodeCoverage \
            -coverageResultsPath "${{ github.workspace }}/CodeCoverage" \
            -coverageOptions "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;useProjectSettings" \
            -logFile -
          EXIT=$?; [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ] || exit $EXIT

      - name: Run PlayMode Tests
        run: |
          "${{ env.UNITY_EDITOR_PATH }}" -batchmode -nographics \
            -runTests -testPlatform PlayMode \
            -projectPath "${{ github.workspace }}" \
            -testResults "${{ github.workspace }}/test-results/playmode-results.xml" \
            -logFile -
          EXIT=$?; [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ] || exit $EXIT

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test-Results
          path: ${{ github.workspace }}/test-results/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Coverage-Report
          path: ${{ github.workspace }}/CodeCoverage/
