name: Lint

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
    paths-ignore:
      - 'doc/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'doc/**'

permissions:
  contents: read

env:
  SOLUTION_FILE: glowcore.sln
  LINT_PROJECT_FILE: Tools/Lint/GlowCore.Lint.csproj
  VERSION_FILE: ProjectSettings/ProjectVersion.txt
  UNITY_MODULES: ''

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: ${{ runner.os }}-unity-library-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json', 'Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-library-

      - name: Setup Unity
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ env.VERSION_FILE }}
          modules: ${{ env.UNITY_MODULES }}
          cache-installation: true

      - name: Activate Unity License
        uses: buildalon/activate-unity-license@v2
        with:
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Generate Project Files
        run: |
          "${{ steps.unity-setup.outputs.unity-editor-path }}" -batchmode -nographics -quit \
            -projectPath "${{ github.workspace }}" \
            -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution \
            -logFile -

      - name: Restore Projects
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Run Code Analysis
        id: code-analysis
        run: |
          dotnet build "${{ env.SOLUTION_FILE }}" \
            -p:EnforceCodeStyleInBuild=true \
            -p:RunAnalyzersDuringBuild=true \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisLevel=latest \
            -p:NoWarn=MSB3277 \
            -warnaserror \
            --no-incremental

      - name: Check Formatting
        id: format-check
        run: |
          dotnet format "${{ env.LINT_PROJECT_FILE }}" --verify-no-changes --severity error
